name: Juro
kind: company
description: Juro is an AI-native contract automation and contract lifecycle management
  (CLM) platform where legal, sales, HR, and finance teams create, negotiate, sign,
  and manage contracts in one browser-based workspace. Juro exposes a documented
  public REST API (v3, base https://api.juro.com/v3, with a sandbox at
  https://api-sandbox.juro.io/v3) authenticated with an x-api-key header. The API
  lets external systems initiate contracts from templates, upload PDFs, edit smart
  fields, send contracts for e-signature, download signed PDFs, and subscribe to a
  dozen-plus contract lifecycle webhook events (contract.created, contract.signed,
  approval events, and more). API access is plan-gated - it is included with a Juro
  subscription and enabled through your Customer Success Manager - so live calls
  require an eligible plan and issued key.
