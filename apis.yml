    outbound webhooks - contract.created, contract.signed, contract.edit,
    contract.pdf_generated, contract.viewed, contract.commented, and the full
    approval-request event set. Webhooks are configured in the Juro app under
    Settings > Integrations > Webhooks; the programmatic registration endpoints
    (POST /v3/webhooks and management verbs) are modeled here from Juro's help-center
    guidance and flagged as endpointsModeled where not confirmed in the public
    reference. Payloads support Basic auth or HMAC-SHA256 signature validation.
