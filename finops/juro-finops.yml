description: >-
  FinOps view of Juro spend. Juro is sold as an annual SaaS subscription priced by
  platform tier (commonly Scale and Enterprise) plus optional AI add-ons, with
  unlimited user seats on higher tiers - so the dominant cost driver is the tier and
  contract volume, not per-seat headcount. The API is not separately metered as a
  product; it is plan-gated and included with the subscription, but usage is bounded
  by a monthly request quota (roughly 100/month on free access, roughly 30,000/month
  on paid) with per-second rate limits. FinOps attention for Juro therefore centers
  on right-sizing the subscription tier, tracking API request consumption against the
  plan quota to avoid throttling or overage conversations, and attributing contract
  throughput to the teams that generate it.
notes: >-
  Per-unit and tier rates are quote-based and not reconciled here; confirm with Juro.
  The API carries a request quota rather than usage-based billing, so the FinOps
  lever is quota headroom and tier selection rather than metered per-call spend.
