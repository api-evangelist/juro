meters:
- name: platform_subscription
  description: Annual Juro platform subscription by tier (Scale, Enterprise). Primary cost.
  unit: subscription
  aggregation: sum
  dimensions:
  - account
  - tier
- name: api_requests
  description: API requests consumed against the plan's monthly quota. Not separately billed, but bounded by quota and rate limits.
  unit: requests
  aggregation: sum
  dimensions:
  - account
  - endpoint
- name: ai_addons
  description: Optional AI drafting/review/summarization add-on spend where applicable.
  unit: addon
  aggregation: sum
  dimensions:
  - account
principles:
- name: Visibility
  description: Track API request consumption against the monthly plan quota and monitor which teams/integrations drive contract volume.
- name: Allocation
  description: Attribute the Juro subscription and API usage to the legal, sales, HR, and finance teams that create and sign contracts.
- name: Optimization
  description: Right-size the subscription tier to actual contract volume; use skip/limit pagination and webhooks (instead of polling) to stay within the API request quota and avoid overage conversations.
- name: Accountability
  description: Assign an owner for the Juro renewal and API quota; review request consumption and contract throughput before renewal.
