openapi: 3.2.0
info:
  title: Juro Health API
  description: The Juro API (v3) programmatically drives contract automation and contract lifecycle management (CLM) on the Juro platform.
  version: '3.0'
  contact:
    name: Juro
    url: https://juro.com
  termsOfService: https://juro.com/terms/api-terms
servers:
- url: https://api.juro.com/v3
  description: Production
- url: https://api-sandbox.juro.io/v3
  description: Sandbox
security:
- apiKeyAuth: []
tags:
- name: Health
  description: API status and key validity.
paths:
  /health:
    get:
      operationId: getHealth
      tags:
      - Health
      summary: Check API status
      description: Returns the API status and confirms the supplied API key is valid.
      responses:
        '200':
          description: The API is healthy and the key is valid.
        '401':
          $ref: '#/components/responses/Unauthorized'
components:
  responses:
    Unauthorized:
      description: The API key is missing or invalid.
  securitySchemes:
    apiKeyAuth:
      type: apiKey
      in: header
      name: x-api-key
      description: API key generated in the Juro app under Settings > Integrations > API. Sent as the `x-api-key` request header.
